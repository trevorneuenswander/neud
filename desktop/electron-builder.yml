appId: com.hildreths.neud
productName: NEUD
copyright: © 2026 NEUD
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
extraResources:
  - from: build/icon.ico
    to: assets/icon.ico
  - from: staging/runtime-assets
    to: runtime-assets
    filter:
      - "**/*"
  - from: staging/runtime-config
    to: runtime-config
    filter:
      - "**/*"
  - from: dist/database/assets/sql-wasm.wasm
    to: database/assets/sql-wasm.wasm
  - from: staging/puppeteer/chrome
    to: puppeteer/chrome
    filter:
      - "**/*"
  - from: ../desktop/staging
    to: staging
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: NEUD-${version}-arm64.${ext}
  # Re-enable with Developer ID signing in the notarization phase (NEUD macOS Phase 2).
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization is enabled in release CI when NEUD_MAC_NOTARIZE=1 and Apple credentials are configured.
  notarize: false
win:
  executableName: NEUD
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: NEUD-Setup-${version}-x64.${ext}
  signAndEditExecutable: false
  signtoolOptions:
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NEUD
  deleteAppDataOnUninstall: false
  uninstallDisplayName: NEUD
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
publish:
  provider: github
  owner: trevorneuenswander
  repo: neud
  releaseType: draft
