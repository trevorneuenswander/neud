<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=3840, height=2160, initial-scale=1" />
<title>Stream Bid Display</title>
<style>
  :root {
    --canvas-w: 3840px;
    --canvas-h: 2160px;
    --main-w: 2743.55px;
    --main-h: calc(var(--main-w) * 9 / 16);
    --main-radius: 54px;
    --pip-w: 882.77px;
    --pip-h: calc(var(--pip-w) * 9 / 16);
    --pip-radius: 50px;
    --outer-margin: calc((var(--canvas-w) - var(--main-w) - var(--pip-w)) / 3);
    --main-top: var(--outer-margin);
    --main-left: var(--outer-margin);
    --column-gap: var(--outer-margin);
    --content-w: calc(var(--canvas-w) - (var(--outer-margin) * 2));
    --side-left: calc(var(--outer-margin) + var(--main-w) + var(--column-gap));
    --pip-top: var(--main-top);
    --pip-to-info: 75px;
    --ticker-h: 240px;
    --title-size: 120px;
    /*
     * Pass 20: bitmap-normalized lot-title renderer.
     * Layout box (--title-region-h) is a probe for approved X/Y/W only.
     * Stage canvas only composites a pre-scanned title bitmap.
     */
    --title-ink-h: 140px;
    --title-bottom-safety: 16px;
    --title-canvas-pad: 24px;
    --title-region-h: calc(var(--title-ink-h) + var(--title-bottom-safety));
    --title-baseline-y: 110px;
    --title-canvas-h: calc(var(--title-ink-h) + (2 * var(--title-canvas-pad)));
    --title-top: calc(
      var(--main-top) + var(--main-h) +
      (
        (var(--canvas-h) - var(--ticker-h) - var(--main-top) - var(--main-h) - var(--title-region-h))
        / 2
      )
    );
    --lot-to-reserve-gap: 20px;
    --reserve-to-bid-gap: 48px;
    --bid-to-currencies-gap: 48px;
    --currency-row-gap: 44px;
    --currency-code-w: 130px;
    --currency-code-gap: 28px;
    --color-lot: #0087db;
    --color-muted: #808080;
    --color-text: #000000;
    --color-bg: #ffffff;
    /*
     * Pass 23 Stream Bid z-order contract (named tokens — do not rely on DOM accident).
     * background (white field) < photos / bid column / pip < lot title < diag overlays
     * Lot Name must sit above any opaque panel that could cover descenders.
     */
    --z-stage-bg: 1;
    --z-pip: 1;
    --z-photos: 2;
    --z-bid: 2;
    --z-title-probe: 0;
    --z-title: 10;
    --z-diag: 50;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-style: normal;
    font-variant: normal;
    color: var(--color-text);
    user-select: none;
  }

  .bid-text {
    margin: 0;
    padding: 0;
    font-weight: 400;
    font-style: normal;
    font-variant: normal;
    line-height: 1;
  }

  .viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .display-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--canvas-w);
    height: var(--canvas-h);
    transform-origin: top left;
  }

  .white-field-composite {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: var(--z-stage-bg);
  }

  .white-field-fill {
    position: absolute;
    inset: 0;
    background: var(--color-bg);
    -webkit-mask: url(#stream-bid-pip-mask);
    mask: url(#stream-bid-pip-mask);
  }

  .main-photo-wrap {
    position: absolute;
    left: var(--main-left);
    top: var(--main-top);
    width: var(--main-w);
    height: var(--main-h);
    aspect-ratio: 16 / 9;
    border-radius: var(--main-radius);
    overflow: hidden;
    background: #ececec;
    z-index: var(--z-photos);
  }

  .main-photo-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .main-photo-current {
    z-index: 1;
  }

  .main-photo-next {
    z-index: 2;
    opacity: 0;
    transform: translateX(18px);
  }

  .main-photo-next.photo-enter {
    animation: photoEnter 650ms cubic-bezier(.16,.84,.24,1) both;
  }

  @keyframes photoEnter {
    from { opacity: 0; transform: translateX(22px) scale(1.015); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  .photo-placeholder {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 400;
    color: var(--color-muted);
    letter-spacing: 0.08em;
  }

  .photo-placeholder.visible {
    display: flex;
  }

  .pip-region {
    position: absolute;
    left: var(--side-left);
    top: var(--main-top);
    width: var(--pip-w);
    height: var(--pip-h);
    aspect-ratio: 16 / 9;
    border-radius: var(--pip-radius);
    background: transparent;
    pointer-events: none;
    z-index: var(--z-pip);
  }

  .bid-column {
    position: absolute;
    left: var(--side-left);
    top: calc(var(--main-top) + var(--pip-h) + var(--pip-to-info));
    width: var(--pip-w);
    z-index: var(--z-bid);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .lot-number {
    font-size: 55px;
    color: var(--color-lot);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-bottom: var(--lot-to-reserve-gap);
  }

  .reserve-status {
    font-size: 55px;
    color: var(--color-muted);
    white-space: nowrap;
    margin-bottom: var(--reserve-to-bid-gap);
  }

  .reserve-status.hidden {
    visibility: hidden;
    height: 0;
    margin-bottom: 0;
    overflow: hidden;
  }

  .reserve-status.placeholder {
    visibility: visible;
    height: auto;
    min-height: 55px;
    margin-bottom: var(--reserve-to-bid-gap);
    overflow: hidden;
  }

  .lot-number.header-enter-prep,
  .reserve-status.header-enter-prep {
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateX(14px);
    animation: none !important;
    transition: none !important;
  }

  .bid-block {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .bid-block.collapsed {
    visibility: hidden;
    height: 0;
    overflow: hidden;
  }

  .bid-block.is-enter-prep .primary-bid,
  .bid-block.is-enter-prep .currency-row {
    transition: none !important;
  }

  .primary-bid {
    font-size: 130px;
    color: var(--color-text);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    white-space: nowrap;
    overflow: hidden;
    margin-bottom: var(--bid-to-currencies-gap);
    letter-spacing: 0;
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 350ms ease-in-out,
      transform 350ms cubic-bezier(.16,.84,.24,1);
    will-change: opacity, transform;
  }

  .primary-bid.pill-hidden,
  .currency-row.pill-hidden {
    opacity: 0;
    transform: translateY(-8px);
  }

  .primary-bid.bid-exit-fade,
  .currency-row.bid-exit-fade {
    opacity: 0;
    transform: translateY(0);
    transition: opacity 250ms ease-in-out;
  }

  .currency-row {
    display: grid;
    grid-template-columns: var(--currency-code-w) minmax(0, 1fr);
    align-items: baseline;
    column-gap: var(--currency-code-gap);
    height: 70px;
    font-size: 70px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 350ms ease-in-out,
      transform 350ms cubic-bezier(.16,.84,.24,1);
    will-change: opacity, transform;
  }

  .bid-block.collapsed .primary-bid {
    margin-bottom: 0;
  }

  .currency-list {
    display: flex;
    flex-direction: column;
    gap: var(--currency-row-gap);
  }

  .currency-code {
    color: var(--color-muted);
  }

  .currency-value {
    color: var(--color-text);
  }

  /*
   * Pass 20 lot-title architecture (BITMAP COMPOSITE):
   *
   *   Offscreen oversized canvas → fillText → pixel-scan ink bounds
   *   → normalized bitmap (+ ≥32px bottom transparent pad)
   *   → drawImage onto full-stage #lotTitleCanvas
   *
   * Production never fillTexts on the stage canvas. Marquee X-clips only.
   */
  .vehicle-title,
  .vehicle-title.title-region {
    position: absolute;
    left: var(--main-left);
    top: var(--title-top);
    width: var(--content-w);
    height: var(--title-region-h);
    min-height: var(--title-region-h);
    /* Layout probe only — never paints production title text. */
    visibility: hidden;
    pointer-events: none;
    overflow: visible;
    z-index: var(--z-title-probe);
  }

  .lot-title-stage-canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--canvas-w);
    height: var(--canvas-h);
    display: block;
    pointer-events: none;
    background: transparent;
    z-index: var(--z-title);
    overflow: visible;
  }

  .lot-title-stage-canvas.is-force-top {
    z-index: 9999;
  }

  .lot-title-stage-canvas.is-fading {
    opacity: 0;
    transition: opacity 250ms ease-in-out;
  }

  .lot-title-stage-canvas.is-entering {
    animation: titleCanvasSlideIn 250ms ease-in-out both;
  }

  @keyframes titleCanvasSlideIn {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Dev-only multi-renderer harness (?titleDiag=1). */
  .title-diag-root {
    position: absolute;
    left: var(--main-left);
    top: 40px;
    width: var(--content-w);
    z-index: var(--z-diag);
    display: none;
    flex-direction: column;
    gap: 18px;
    pointer-events: none;
  }

  /* Pass 23 composite occlusion proof strip (dev-only via ?compositeDiag=1). */
  .composite-diag-cyan-band {
    position: absolute;
    left: var(--main-left);
    width: var(--content-w);
    height: 30px;
    background: #00ffff;
    pointer-events: none;
    z-index: calc(var(--z-title) - 1);
    display: none;
  }
  .composite-diag-cyan-band.is-active {
    display: block;
  }
  .title-diag-root.is-active {
    display: flex;
  }
  .title-diag-panel {
    position: relative;
    width: 100%;
    min-height: 260px;
    background: rgba(255, 255, 255, 0.92);
    border: 4px solid #222;
    overflow: visible;
    padding: 12px 12px 48px;
  }
  .title-diag-panel[data-renderer="html"] { border-color: #c62828; }
  .title-diag-panel[data-renderer="canvas"] { border-color: #1565c0; }
  .title-diag-panel[data-renderer="svg"] { border-color: #2e7d32; }
  .title-diag-panel[data-renderer="production"] { border-color: #6a1b9a; }
  .title-diag-label {
    font: 700 28px Helvetica, Arial, sans-serif;
    color: #111;
    margin-bottom: 6px;
  }
  .title-diag-html {
    font: 400 120px Helvetica, Arial, sans-serif;
    color: #000;
    line-height: 1.6;
    white-space: nowrap;
    overflow: visible;
    padding-bottom: 32px;
  }
  .title-diag-canvas {
    display: block;
    width: 100%;
    height: 220px;
    background: transparent;
  }
  .title-diag-svg {
    display: block;
    width: 100%;
    height: 220px;
    overflow: visible;
  }

  /* Pass 24: font comparison diagnostic (?titleFontDiag=1). Production unaffected. */
  .title-font-diag-root {
    position: absolute;
    left: var(--main-left);
    top: 40px;
    width: var(--content-w);
    z-index: var(--z-diag);
    display: none;
    flex-direction: column;
    gap: 28px;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.96);
    border: 4px solid #111;
    padding: 24px 28px 40px;
  }
  .title-font-diag-root.is-active {
    display: flex;
  }
  .title-font-diag-heading {
    font: 700 36px Helvetica, Arial, sans-serif;
    color: #111;
  }
  .title-font-diag-row {
    position: relative;
    width: 100%;
    min-height: 220px;
    border-top: 2px solid #ccc;
    padding-top: 12px;
  }
  .title-font-diag-label {
    font: 700 26px Helvetica, Arial, sans-serif;
    color: #222;
    margin-bottom: 8px;
  }
  .title-font-diag-meta {
    font: 400 22px Helvetica, Arial, sans-serif;
    color: #444;
    margin-bottom: 8px;
  }
  .title-font-diag-canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    background: #fff;
  }
  .title-font-diag-dom {
    font-weight: 400;
    font-size: 120px;
    line-height: 1.6;
    padding: 4px 0 40px;
    margin: 0;
    overflow: visible;
    white-space: nowrap;
    background: #fff;
    color: #000;
    transform: none;
  }

  .fade-out {
    animation: fadeOut 250ms ease-in-out both;
    will-change: opacity;
  }

  .slide-in-right {
    animation: slideInRight 250ms ease-in-out both;
    will-change: transform, opacity;
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <svg aria-hidden="true" width="3840" height="2160" style="position:absolute;left:-10000px;top:0;pointer-events:none;">
    <defs>
      <mask id="stream-bid-pip-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="3840" height="2160">
        <rect x="0" y="0" width="3840" height="2160" fill="white"></rect>
        <rect id="pipCutoutRect" x="2886.0033333334" y="71.2266666667" width="882.77" height="496.558125" rx="50" ry="50" fill="black"></rect>
      </mask>
    </defs>
  </svg>

  <div class="viewport">
    <div id="stage" class="display-stage">
      <div class="white-field-composite" aria-hidden="true">
        <div class="white-field-fill"></div>
      </div>
      <div class="pip-region" aria-hidden="true"></div>

      <div class="main-photo-wrap">
        <img id="mainPhoto" class="main-photo-current hidden" alt="" />
        <img id="nextPhoto" class="main-photo-next hidden" alt="" />
        <div id="photoPlaceholder" class="photo-placeholder"></div>
      </div>

      <section class="bid-column">
        <div id="lotNumber" class="lot-number bid-text">Lot —</div>
        <div id="reserveStatus" class="reserve-status bid-text hidden"></div>
        <div id="bidBlock" class="bid-block collapsed">
          <div id="primaryBid" class="primary-bid bid-text"></div>
          <div id="currencyList" class="currency-list"></div>
        </div>
      </section>

      <!-- Pass 22/23: layout probe only. Title = fixed vertical slab → composite. -->
      <div
        id="vehicleTitle"
        class="vehicle-title title-region"
        data-title=""
        data-title-layout="pass22"
        data-title-mode="single"
        data-title-renderer="bitmap-composite"
        data-title-root-cause="composite-occlusion-investigation-pass23"
        data-z-contract="pass23"
        aria-hidden="true"
      ></div>

      <!-- Pass 23: cyan band sits UNDER title (z-title - 1). If cyan vanishes but magenta title remains → occlusion. -->
      <div
        id="compositeDiagCyanBand"
        class="composite-diag-cyan-band"
        aria-hidden="true"
        data-composite-diag="cyan-band"
      ></div>

      <div id="titleDiagRoot" class="title-diag-root" aria-hidden="true">
        <div class="title-diag-panel" data-renderer="html">
          <div class="title-diag-label">A · HTML (safe, no clip)</div>
          <div id="titleDiagHtml" class="title-diag-html"></div>
        </div>
        <div class="title-diag-panel" data-renderer="canvas">
          <div class="title-diag-label">B · Canvas (safe, no clip)</div>
          <canvas id="titleDiagCanvas" class="title-diag-canvas"></canvas>
        </div>
        <div class="title-diag-panel" data-renderer="svg">
          <div class="title-diag-label">C · SVG (safe, no clip)</div>
          <svg id="titleDiagSvg" class="title-diag-svg" xmlns="http://www.w3.org/2000/svg" overflow="visible" viewBox="0 0 3600 180">
            <text id="titleDiagSvgText" x="0" y="120" font-size="120" font-family="Helvetica, Arial, sans-serif" fill="#000"></text>
          </svg>
        </div>
        <div class="title-diag-panel" data-renderer="production">
          <div class="title-diag-label">D · Production Lot Name (current canvas path)</div>
          <div id="titleDiagProductionNote" class="title-diag-html" style="font-size:36px;line-height:1.2;">
            See live #lotTitleCanvas full-stage overlay (same stage).
          </div>
        </div>
      </div>

      <!-- Pass 24: font comparison diagnostic (dev-only). -->
      <div id="titleFontDiagRoot" class="title-font-diag-root" aria-hidden="true" data-title-font-diag="1">
        <div class="title-font-diag-heading">Title font diagnostic — production path vs DOM controls</div>
        <div id="titleFontDiagRows"></div>
      </div>

      <!-- Pass 23: title canvas LAST in DOM + --z-title so it paints above opaque panels. -->
      <canvas
        id="lotTitleCanvas"
        class="lot-title-stage-canvas"
        width="3840"
        height="2160"
        aria-hidden="true"
        data-title-stage-canvas="1"
        data-title-compositor="bitmap"
        data-z-layer="title"
      ></canvas>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var CANVAS_W = 3840;
  var CANVAS_H = 2160;
  var CURRENCY_CODES = ["EUR", "GBP", "CHF", "JPY"];
  var FADE_MS = 250;
  var PHOTO_CYCLE_MS = 6000;
  var PHOTO_TRANSITION_MS = 650;
  var BID_PILL_HIDE_MS = 350;
  var BID_PILL_STAGGER_BASE_MS = 380;
  var BID_PILL_STAGGER_STEP_MS = 130;
  var TITLE_SIZE_MAX = 120;
  var TITLE_SIZE_MIN = 72;
  var TITLE_OVERFLOW_TOLERANCE = 1;
  var TITLE_MARQUEE_V = 52;
  var TITLE_MARQUEE_EASE_SEC = 1;
  var TITLE_MARQUEE_PAUSE_MS = 4000;
  var TITLE_MEASURE_EPS = 0.5;
  // Pass 22: fixed vertical slab — NEVER crop production bitmap top/bottom from ink bounds.
  var TITLE_SLAB_HEIGHT = 480;
  var TITLE_SLAB_BASELINE_Y = 200;
  var TITLE_PAD_X = 24;
  var TITLE_COMPOSITE_PARAMS = new URLSearchParams(location.search || "");
  var TITLE_COMPOSITE_DIAG = TITLE_COMPOSITE_PARAMS.get("compositeDiag") === "1";
  var TITLE_FORCE_TOP = TITLE_COMPOSITE_PARAMS.get("titleForceTop") === "1";
  var TITLE_INK_COLOR = TITLE_COMPOSITE_DIAG ? "#FF00FF" : "#000000";
  var titleMarqueeDiagnostics = {
    originalAlignmentRestored: true,
    anchorOffset: 0,
    viewportWidth: 0,
    textWidth: 0,
    overflowPx: 0,
    shouldScroll: false,
    speedPxPerSecond: TITLE_MARQUEE_V,
    durationMs: 0,
    titleSignatureChanged: false,
    resetReason: null,
    fullTravelCompleted: false,
    offsetX: 0,
  };
  var lastTitleMarqueeSignature = null;

  var stage = document.getElementById("stage");
  var lotNumberEl = document.getElementById("lotNumber");
  var reserveStatusEl = document.getElementById("reserveStatus");
  var bidBlockEl = document.getElementById("bidBlock");
  var primaryBidEl = document.getElementById("primaryBid");
  var currencyListEl = document.getElementById("currencyList");
  var vehicleTitleEl = document.getElementById("vehicleTitle");
  var lotTitleCanvasEl = document.getElementById("lotTitleCanvas");
  var compositeDiagCyanBandEl = document.getElementById("compositeDiagCyanBand");
  var titleMarqueeRafId = null;
  if (lotTitleCanvasEl && TITLE_FORCE_TOP) {
    lotTitleCanvasEl.classList.add("is-force-top");
  }
  var titleCanvasState = {
    text: "",
    fontSize: 120,
    scroll: false,
    offsetX: 0,
    layout: null,
    /** @type {HTMLCanvasElement|null} */
    normalizedBitmap: null,
    inkWidth: 0,
    inkHeight: 0,
    inkOffsetX: 0,
    /** Distance from bitmap top to alphabetic baseline (fixed slab). */
    inkOffsetY: TITLE_SLAB_BASELINE_Y,
    slabBaselineY: TITLE_SLAB_BASELINE_Y,
    bitmapPadTop: TITLE_SLAB_BASELINE_Y,
    bitmapPadBottom: TITLE_SLAB_HEIGHT - TITLE_SLAB_BASELINE_Y,
    cacheKey: "",
    showInkGuide: false,
  };
  var mainPhotoEl = document.getElementById("mainPhoto");
  var nextPhotoEl = document.getElementById("nextPhoto");
  var photoPlaceholderEl = document.getElementById("photoPlaceholder");

  var photoList = [];
  var photoIndex = 0;
  var photoCycleTimer = null;
  var photoSessionGeneration = 0;
  var photoTransitionToken = 0;
  var lastBidVisibleState = null;
  var pendingBidHideTimer = null;
  var bidAnimationTimers = [];
  var bidTransitionGeneration = 0;
  var bidGroupVisible = false;
  var lastCurrencySig = "";
  var activeLotKey = null;
  var renderedBidState = null;
  var pendingBidFadeTimer = null;
  var bidEntranceRafId = null;
  var bidEntranceRafGeneration = 0;
  var renderedHeaderState = null;
  var currentHeaderLotKey = null;
  var headerTransitionGeneration = 0;
  var headerTransitionInProgress = false;
  var headerAnimationTimers = [];
  var headerEntranceRafId = null;
  var headerEntranceRafGeneration = 0;

  function textValue(value) {
    if (value == null) return "";
    return String(value).trim();
  }

  function isPresentText(value) {
    var trimmed = textValue(value);
    return Boolean(trimmed && trimmed !== "—" && trimmed !== "-");
  }

  function hasBidValue(value) {
    var v = textValue(value);
    if (!v || v === "—") return false;
    if (/^\$?\s*0(?:\.00)?$/i.test(v)) return false;
    return /\d/.test(v);
  }

  function resolveBiddingPrice(display) {
    if (!display || typeof display !== "object") return "";
    return textValue(display.biddingPrice) || textValue(display.price) || "";
  }

  function normalizeBidDisplayText(value) {
    var text = textValue(value);
    if (!text) return "";
    return text.replace(/^\$\s+/, "$");
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")

    titleMarqueeDiagnostics.titleSignatureChanged = signatureChanged;

      overflowPx / 2,

  function scanDescenderTail(canvas) {
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return null;
    var width = canvas.width;
    var height = canvas.height;
    var img = ctx.getImageData(0, 0, width, height);
    var data = img.data;
    var first = -1;
    var last = -1;
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        var i = (y * width + x) * 4;
        if (data[i + 3] > 8 && data[i] < 80) {
          if (first < 0) first = y;
          last = y;
          break;
        }
      }
    }
    var tail = [];
    if (last >= 0) {
      for (var row = Math.max(first, last - 4); row <= last; row += 1) {
        var n = 0;
        var maxA = 0;
        for (var px = 0; px < width; px += 1) {
          var p = (row * width + px) * 4;
          if (data[p + 3] > 8 && data[p] < 80) {
            n += 1;
            if (data[p + 3] > maxA) maxA = data[p + 3];

        tail.push({ rel: row - last, n: n, maxA: maxA });
      }
    }
    return { firstRow: first, lastRow: last, tail: tail };

  function transitionPhoto(src) {
    var next = textValue(src);

    var generation = photoSessionGeneration;
    var transitionToken = ++photoTransitionToken;

    if (next) {

        if (!photoCallbackIsCurrent(generation, transitionToken)) return;

        if (mainPhotoEl.classList.contains("hidden")) {

          mainPhotoEl.classList.remove("fade-out", "slide-in-right");
          return;

        nextPhotoEl.src = next;
        nextPhotoEl.setAttribute("data-src", next);
        nextPhotoEl.classList.remove("hidden", "photo-enter");
        void nextPhotoEl.offsetWidth;
        nextPhotoEl.classList.add("photo-enter");

    mainPhotoEl.classList.add("hidden");
    mainPhotoEl.classList.remove("fade-out", "slide-in-right");

    nextPhotoEl.setAttribute("data-src", "");

  function fitCurrencyValues() {

    );

  function transitionCurrencyRows(currencies) {
    var rows = parseCurrencyRows(currencies);
    var sig = rows.map(function (row) { return row.code + ":" + row.value; }).join("|");
    var html = buildCurrencyHTML(rows, false);
    var cur = currencyListEl.getAttribute("data-sig") || "";
    if (cur === sig) return;

    currencyListEl.setAttribute("data-sig", sig);
    lastCurrencySig = sig;

    var temp = document.createElement("div");
    temp.innerHTML = html;

    var oldRows = Array.prototype.slice.call(currencyListEl.querySelectorAll(".currency-row"));
    var newRows = Array.prototype.slice.call(temp.querySelectorAll(".currency-row"));

    if (!newRows.length) {
      currencyListEl.innerHTML = "";
      return;
    }

    if (!oldRows.length) {
      currencyListEl.innerHTML = html;
      fitCurrencyValues();
      return;
    }

    newRows.forEach(function (newRow, i) {
      var oldRow = oldRows[i];

      if (!oldRow) {
        currencyListEl.appendChild(newRow);
        fitTextToWidth(newRow.querySelector(".currency-value"), 42, 70);
        return;
      }

      var oldValue = oldRow.querySelector(".currency-value");
      var newValue = newRow.querySelector(".currency-value");

      if (!oldValue || !newValue) {
        oldRow.innerHTML = newRow.innerHTML;
        fitTextToWidth(oldRow.querySelector(".currency-value"), 42, 70);
        return;
      }

      var oldText = oldValue.textContent.trim();
      var newText = newValue.textContent.trim();

      if (oldText === newText) return;

      oldValue.classList.remove("fade-out", "slide-in-right");
      void oldValue.offsetWidth;
      oldValue.classList.add("fade-out");

      setTimeout(function () {
        oldValue.textContent = newText;
        oldValue.classList.remove("fade-out", "slide-in-right");
        void oldValue.offsetWidth;
        oldValue.classList.add("slide-in-right");

        setTimeout(function () {
          oldValue.classList.remove("slide-in-right");
          fitTextToWidth(oldValue, 42, 70);
        }, FADE_MS);
      }, FADE_MS);
    });

    while (currencyListEl.children.length > newRows.length) {
      currencyListEl.removeChild(currencyListEl.lastElementChild);
    }
  }

  function resetBidPillAnimationClasses() {

  function setBidVisibility(shouldShow) {

    }

      if (hasRealBid) {
        ensureBidGroupSettled();
        return;
      }

        return;
      }
    }

    if (hasRealBid) {
      if (!renderedBidState || renderedBidState.lotKey !== activeLotKey) return;
      lastBidVisibleState = true;
      beginBidEntranceFromState(renderedBidState);

  function renderBidSection(display) {

  function formatReserveStatusForStreamBid(value) {
    var text = textValue(value);
    // Only "Offered Without Reserve" is ever shown. Has Reserve keeps a blank
    // placeholder row; Unknown and any other value (Active, Reserve, ...) are blank.
    if (!text || /^unknown$/i.test(text)) {
      return { display: "", layout: "hidden" };
    }
    if (/offered\s+without\s+reserve|offered_without_reserve|no[-_]?reserve|without\s+reserve/i.test(text)) {
      return { display: "Offered Without Reserve", layout: "visible" };
    }
    if (/has[-_\s]?reserve|with\s+reserve/i.test(text)) {
      return { display: "", layout: "placeholder" };
    }
    return { display: "", layout: "hidden" };
  }

  function buildHeaderState(display) {

  function updateReserveStatus(rawValue) {

    applyReserveStatusLayout(formatted.layout);
    var next = formatted.display;
    var cur = reserveStatusEl.getAttribute("data-text") ?? reserveStatusEl.textContent ?? "";

      return;

      reserveStatusEl.setAttribute("data-text", "");
      reserveStatusEl.classList.add("hidden");
      return;
    }

    reserveStatusEl.classList.remove("hidden");

    if (formatted.layout === "placeholder") {

      reserveStatusEl.setAttribute("data-text", "");
      return;
    }

    transitionText(reserveStatusEl, next);
  }

  window.render = function render(feed) {
    var d = (feed && feed.auctionDisplay) || {};

  scaleStage();

    if (document.fonts && document.fonts.ready) {

  window.addEventListener("resize", function () {
