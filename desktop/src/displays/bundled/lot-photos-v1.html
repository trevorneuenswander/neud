<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=3840, height=2160, initial-scale=1" />
<title>Lot Photos</title>
<style>
  :root {
    --canvas-w: 3840px;
    --canvas-h: 2160px;
    --fade-ms: 250ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .stage {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--canvas-w);
    height: var(--canvas-h);
    background: #000;
    overflow: hidden;
    transform-origin: top left;
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    opacity: 0;
    transition: opacity var(--fade-ms) ease;
    background: #000;
  }
  .photo.is-visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="photo is-visible" id="photoA" alt="" draggable="false" />
    <img class="photo" id="photoB" alt="" draggable="false" />
  </div>
  <script>
    (function () {
      var CANVAS_W = 3840;
      var CANVAS_H = 2160;
      var FADE_MS = 250;
      var PHOTO_CYCLE_MS = 6000;
      var photoSessionGeneration = 0;
      var photoList = [];
      var photoIndex = 0;
      var photoCycleTimer = null;
      var showingA = true;
      var stage = document.getElementById("stage");
      var photoA = document.getElementById("photoA");
      var photoB = document.getElementById("photoB");

      function textValue(value) {
        if (value == null) return "";
        if (typeof value === "string") return value.trim();
        if (typeof value === "number" && Number.isFinite(value)) return String(value);
        return "";
      }

      function isUsablePhotoUrl(url) {
        if (!url) return false;
        var trimmed = String(url).trim();
        if (!trimmed) return false;
        if (/logo|icon|avatar|badge|spinner|placeholder|favicon|1x1|pixel|no-image|noimage|missing|pip/i.test(trimmed)) {
          return false;
        }
        if (/no[-_]?photo|default[-_]?image|coming[-_]?soon/i.test(trimmed)) {
          return false;
        }
        return /^https?:\/\//i.test(trimmed) || trimmed.indexOf("/api/offline-assets/") === 0;
      }

      function filterPhotos(photos) {
        var ordered = [];
        var seen = {};
        if (!Array.isArray(photos)) return ordered;
        for (var i = 0; i < photos.length; i += 1) {
          var entry = photos[i];
          var url = "";
          if (typeof entry === "string") {
            url = textValue(entry);
          } else if (entry && typeof entry === "object") {
            url = textValue(
              entry.localUrl ||
                entry.displayUrl ||
                entry.url ||
                entry.src ||
                entry.remoteUrl ||
                entry.originalUrl ||
                "",
            );
          }
          if (!url || !isUsablePhotoUrl(url) || seen[url]) continue;
          seen[url] = true;
          ordered.push(url);
        }
        return ordered;
      }

      function photoCallbackIsCurrent(generation) {
        return generation === photoSessionGeneration;
      }

      function showBlack(generation) {
        if (!photoCallbackIsCurrent(generation)) return;
        photoA.classList.remove("is-visible");
        photoB.classList.remove("is-visible");
        photoA.removeAttribute("src");
        photoB.removeAttribute("src");
      }

      function transitionPhoto(url, generation) {
        if (!photoCallbackIsCurrent(generation)) return;
        if (!url) {
          showBlack(generation);
          return;
        }
        var incoming = showingA ? photoB : photoA;
        var outgoing = showingA ? photoA : photoB;
        var token = generation;
        incoming.onload = function () {
          if (!photoCallbackIsCurrent(token)) return;
          incoming.classList.add("is-visible");
          outgoing.classList.remove("is-visible");
          showingA = !showingA;
        };
        incoming.onerror = function () {
          if (!photoCallbackIsCurrent(token)) return;
          showBlack(token);
        };
        if (incoming.getAttribute("src") === url) {
          incoming.onload();
          return;
        }
        incoming.src = url;
      }

      function setPhotos(photos) {
        var nextList = filterPhotos(photos);
        var sig = nextList.join("|");
        if ((stage.getAttribute("data-photo-list") || "") === sig) return;

        photoSessionGeneration += 1;
        var generation = photoSessionGeneration;
        stage.setAttribute("data-photo-list", sig);
        photoList = nextList;
        photoIndex = 0;

        if (photoCycleTimer) {
          clearInterval(photoCycleTimer);
          photoCycleTimer = null;
        }

        transitionPhoto(photoList[0] || "", generation);

        if (photoList.length > 1) {
          photoCycleTimer = setInterval(function () {
            if (generation !== photoSessionGeneration) return;
            if (!photoList.length) return;
            photoIndex = (photoIndex + 1) % photoList.length;
            transitionPhoto(photoList[photoIndex], generation);
          }, PHOTO_CYCLE_MS);
        }
      }

      function scaleStage() {
        var scale = Math.min(window.innerWidth / CANVAS_W, window.innerHeight / CANVAS_H);
        var offsetX = (window.innerWidth - CANVAS_W * scale) / 2;
        var offsetY = (window.innerHeight - CANVAS_H * scale) / 2;
        stage.style.transform =
          "translate(" + offsetX + "px, " + offsetY + "px) scale(" + scale + ")";
      }

      function render(feed) {
        var d = (feed && feed.auctionDisplay) || feed || {};
        setPhotos(Array.isArray(d.photos) ? d.photos : []);
      }

      scaleStage();
      window.addEventListener("resize", scaleStage);

      window.render = render;
      window.__NEUD_LOT_PHOTOS__ = {
        FADE_MS: FADE_MS,
        PHOTO_CYCLE_MS: PHOTO_CYCLE_MS,
        setPhotos: setPhotos,
        filterPhotos: filterPhotos,
        getPhotoSessionGeneration: function () {
          return photoSessionGeneration;
        },
        getPhotoList: function () {
          return photoList.slice();
        },
      };

      /*__NEUD_LOT_PHOTOS_BRIDGE__*/
    })();
  </script>
</body>
</html>
