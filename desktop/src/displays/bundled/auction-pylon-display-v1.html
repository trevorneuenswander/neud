<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auction Pylon Display</title>
<!-- Pylon HTML v1.24 -->
<style>
  html,body{ margin:0; padding:0; background:transparent; }
  body{
    width:1920px;
    height:1080px;
    overflow:hidden;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    color:#fff;
  }

  :root{
    --bg:rgba(5,8,13,0.85);
    --pill:rgba(255,255,255,.10);
    --shadow:0 10px 36px rgba(0,0,0,.45);
    --radius:14px;
  }

  .top-gradient{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:260px;
    pointer-events:none;
    z-index:1;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.5) 0%,
      rgba(0,0,0,0.36) 28%,
      rgba(0,0,0,0.18) 58%,
      rgba(0,0,0,0.06) 82%,
      rgba(0,0,0,0) 100%
    );
  }

  .safe{
    position:absolute;
    left:56px;
    top:56px;
    bottom:130px;
    width:480px;
    z-index:2;
  }

  .top-title-pill{
    position:absolute;
    left:0;
    top:-40px;
    width:1920px;
    background:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border-radius:0;
    box-shadow:none;
    padding:0;
    box-sizing:border-box;
    z-index:5;
  }

  .title-scroll{
    position:relative;
    overflow-x:visible;
    overflow-y:visible;
    height:2.5em;
    white-space:nowrap;
    display:flex;
    align-items:center;
    font-size:58px;
    line-height:1.05;
    font-weight:600;
    padding-left:0;
    margin-bottom:12px;
    text-shadow:0 3px 5px rgba(0,0,0,0.75);
  }

  .title-scroll .inner{
    display:inline-block;
    white-space:nowrap;
    transform:translate3d(0,0,0);
    will-change:transform;
    backface-visibility:hidden;
  }

  .pylon{
    position:absolute;
    left:0;
    top:96px;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow:hidden;
    background:var(--bg);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:height 760ms cubic-bezier(.16,.84,.24,1);
    will-change:height;
  }

  .photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    background:rgba(255,255,255,.06);
    overflow:hidden;
    flex:0 0 auto;
  }

  .photo-wrap img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:1;
    transform:translateX(0);
  }

  .photo-current{ z-index:1; }

  .photo-next{
    z-index:2;
    opacity:0;
    transform:translateX(18px);
  }

  .photo-next.photo-enter{
    animation:photoEnter 650ms cubic-bezier(.16,.84,.24,1) both;
  }

  @keyframes photoEnter{
    from{ opacity:0; transform:translateX(22px) scale(1.015); }
    to  { opacity:1; transform:translateX(0) scale(1); }
  }

  .photo-placeholder{
    position:absolute;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    opacity:.5;
    text-transform:uppercase;
    letter-spacing:.4px;
  }

  .content{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
    flex:0 0 auto;
  }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
  }

  .label{ display:none; }

  .lot-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--pill);
    border-radius:12px;
    padding:9px 13px;
    height:48px;
    min-width:136px;
    font-size:37px;
    font-weight:700;
    white-space:nowrap;
    text-decoration:underline;
    text-decoration-color:rgba(255,255,255,0.6);
    text-decoration-thickness:1px;
    text-underline-offset:5px;
    font-variant-numeric:tabular-nums;
    overflow:hidden;
  }

  .reserve-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    text-align:left;
    font-size:18px;
    font-weight:800;
    letter-spacing:.35px;
    opacity:.9;
    text-transform:uppercase;
    white-space:nowrap;
    line-height:1.05;
  }

  .bid-section{
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    max-height:none;
    margin-top:0;
    opacity:1;
    transform:none;
  }

  .bid-section.collapsed{
    display:none;
    pointer-events:none;
  }

  .price-box,
  .currency-row{
    opacity:1;
    transform:translateY(0);
    transition:
      opacity 350ms ease-in-out,
      transform 350ms cubic-bezier(.16,.84,.24,1);
    will-change:opacity, transform;
  }

  .price-box.pill-hidden,
  .currency-row.pill-hidden{
    opacity:0;
    transform:translateY(-8px);
  }

  .price-box{
    background:var(--pill);
    border-radius:12px;
    padding:14px 12px;
  }

  .price-label{
    font-size:18px;
    font-weight:800;
    letter-spacing:.35px;
    opacity:.75;
    text-transform:uppercase;
    margin-bottom:4px;
  }

  .price{
    font-size:38px;
    line-height:1;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .currencies{
    display:flex;
    flex-direction:column;
    gap:7px;
    min-height:0;
    overflow:hidden;
  }

  .currency-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--pill);
    border-radius:10px;
    padding:7px 10px;
    font-size:22px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .logo-wrap{
    padding:0 16px 16px;
    flex:0 0 auto;
    transform:translateZ(0);
    will-change:transform;
  }

  .logo-wrap img{
    width:100%;
    display:block;
    object-fit:contain;
  }

  .status{
    position:absolute;
    left:0;
    bottom:-22px;
    font-size:12px;
    opacity:.55;
  }

  .hidden{ display:none !important; }

  .fade-out{
    animation:fadeOut 250ms ease-in-out both;
    will-change:opacity;
  }

  .slide-in-right{
    animation:slideInRight 250ms ease-in-out both;
    will-change:transform, opacity;
  }

  @keyframes fadeOut{
    from{ opacity:1; }
    to{ opacity:0; }
  }

  @keyframes slideInRight{
    from{ opacity:0; transform:translateX(14px); }
    to{ opacity:1; transform:translateX(0); }
  }
</style>
</head>

<body>
  <div class="top-gradient"></div>

  <div class="safe">
    <div class="top-title-pill">
      <div id="titleWrap" class="title-scroll" data-title="—">
        <span class="inner">—</span>
      </div>
    </div>

    <div id="pylon" class="pylon">
      <div class="photo-wrap">
        <img id="mainPhoto" class="photo-current hidden" alt="">
        <img id="nextPhoto" class="photo-next hidden" alt="">
        <div id="photoPlaceholder" class="photo-placeholder">No Image</div>
      </div>

      <div class="content">
        <div class="top-row">
          <div class="label">
            <span>CURRENT</span>
            <span>LOT</span>
          </div>

          <div id="lot" class="lot-pill">Lot —</div>

          <div id="reserveText" class="reserve-text hidden">
            <span>OFFERED</span>
            <span>WITHOUT RESERVE</span>
          </div>
        </div>

        <div id="bidSection" class="bid-section collapsed">
          <div class="price-box pill-hidden">
            <div class="price-label">Current Bid</div>
            <div id="price" class="price">—</div>
          </div>

          <div id="currencies" class="currencies"></div>
        </div>
      </div>

      <div class="logo-wrap">
        <img src="26-Broad-Arrow-Auctions-Logo-H-DrivenByHagerty_Website_PNG-WhiteBlue[13].png" alt="Broad Arrow Auctions">
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const POLL = +(params.get('poll') || 1000);

let ENDPOINT = params.get('src');
if (!ENDPOINT) {
  console.warn('[pylon] Missing ?src= endpoint');
} else {
  try { ENDPOINT = new URL(ENDPOINT, location.origin).href; } catch(_) {}
}

const FADE_MS = 250;
const PHOTO_CYCLE_MS = 6000;
const PHOTO_TRANSITION_MS = 650;

const pylonEl = document.getElementById('pylon');
const bidSectionEl = document.getElementById('bidSection');
const lotEl = document.getElementById('lot');
const reserveTextEl = document.getElementById('reserveText');
const titleWrap = document.getElementById('titleWrap');
const priceEl = document.getElementById('price');
const currenciesEl = document.getElementById('currencies');
const photoEl = document.getElementById('mainPhoto');
const nextPhotoEl = document.getElementById('nextPhoto');
const photoPlaceholderEl = document.getElementById('photoPlaceholder');
const statusEl = document.getElementById('status');

const V = 40;
const EASE_SEC = 1;
const PAUSE_MS = 4000;
const EPS = 0.5;
const rafs = new WeakMap();

let photoList = [];
let photoIndex = 0;
let photoCycleTimer = null;
let bidAnimationTimer = null;
let bidAnimationTimers = [];
let lastBidVisibleState = null;
let pendingBidHideTimer = null;

function animatePylonHeightAfterLayoutChange(changeLayout){
  const startHeight = pylonEl.getBoundingClientRect().height;

  pylonEl.style.transition = 'none';
  pylonEl.style.height = `${startHeight}px`;
  pylonEl.offsetHeight;

  changeLayout();

  pylonEl.style.height = 'auto';
  const endHeight = pylonEl.getBoundingClientRect().height;

  pylonEl.style.height = `${startHeight}px`;
  pylonEl.offsetHeight;

  pylonEl.style.transition = 'height 760ms cubic-bezier(.16,.84,.24,1)';
  pylonEl.style.height = `${endHeight}px`;

  clearTimeout(pylonEl._heightTimer);
  pylonEl._heightTimer = setTimeout(() => {
    pylonEl.style.height = 'auto';
  }, 780);
}

function updatePylonHeight(){
  animatePylonHeightAfterLayoutChange(() => {});
}

function cancelLoop(c){
  if(rafs.has(c)){
    cancelAnimationFrame(rafs.get(c));
    rafs.delete(c);
  }
}

function measureWidth(el){
  const r = el.getBoundingClientRect();
  return r.width || el.scrollWidth || 1e-6;
}

function escapeHTML(s){
  return (s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function ensureTrack(container){
  const inner = container.querySelector('.inner');
  if(!inner) return {mode:'single', width:0};

  const text = (container.getAttribute('data-title') || inner.textContent || '—').trim() || '—';

  if (container.classList.contains('fade-out')) {
    const w = measureWidth(inner);
    if (w <= container.clientWidth + EPS) return {mode:'single', width:w};
    return {mode:'loop', width:Math.max(w, 1e-6)};
  }

  inner.textContent = text;
  const singleW = measureWidth(inner);

  if (singleW <= container.clientWidth + EPS){
    inner.setAttribute('data-built','single');
    inner.style.transform = 'translate3d(0,0,0)';
    return {mode:'single', width:singleW};
  }

  const sig = `loop:${text}`;
  if (inner.getAttribute('data-built') !== sig){
    const gap = '\u00A0\u00A0\u00A0•\u00A0\u00A0\u00A0';
    inner.innerHTML =
      `<span class="copyA">${escapeHTML(text)}</span>`+
      `<span class="gap">${gap}</span>`+
      `<span class="copyB">${escapeHTML(text)}</span>`;
    inner.setAttribute('data-built', sig);
  }

  const a = inner.querySelector('.copyA');
  const g = inner.querySelector('.gap');
  const loopW = (measureWidth(a) + measureWidth(g)) || 1e-6;
  return {mode:'loop', width:loopW};
}

function startMarquee(container){
  cancelLoop(container);
  const inner = container.querySelector('.inner');
  if(!inner) return;

  const tr = ensureTrack(container);
  if (tr.mode === 'single'){
    inner.style.transform = 'translate3d(0,0,0)';
    return;
  }

  const a = V / EASE_SEC;
  const easeDist = 0.5 * a * EASE_SEC * EASE_SEC;
  const cruiseDist = Math.max(0, tr.width - 2*easeDist);
  const cruiseSec = cruiseDist / V;
  const totalSec = EASE_SEC + cruiseSec + EASE_SEC;
  const totalMs  = totalSec * 1000;

  let phase = 'prepause';
  let t0 = performance.now();

  function sAt(ms){
    const t = ms/1000;
    if (t <= 0) return 0;
    if (t <= EASE_SEC) return 0.5*a*t*t;
    if (t <= EASE_SEC + cruiseSec) return easeDist + V*(t - EASE_SEC);
    if (t <= totalSec){
      const u = t - (EASE_SEC + cruiseSec);
      return easeDist + cruiseDist + (V*u - 0.5*a*u*u);
    }
    return tr.width;
  }

  function tick(now){
    const id = requestAnimationFrame(tick);
    rafs.set(container, id);

    if (phase === 'prepause'){
      inner.style.transform = 'translate3d(0,0,0)';
      if (now - t0 >= PAUSE_MS){
        phase='scroll';
        t0=now;
      }
      return;
    }

    const elapsed = now - t0;
    if (elapsed >= totalMs - 0.1){
      inner.style.transform = `translate3d(${-tr.width}px,0,0)`;
      inner.style.transform = 'translate3d(0,0,0)';
      phase = 'prepause';
      t0 = now;
      return;
    }

    const d = sAt(elapsed);
    inner.style.transform = `translate3d(${-d}px,0,0)`;
  }

  requestAnimationFrame(tick);
}

function transitionText(el, newText){
  const next = (newText ?? '').toString().trim() || '—';
  const cur = el.getAttribute('data-text') ?? el.textContent ?? '';
  if (cur === next) return;

  el.setAttribute('data-text', next);

  el.classList.remove('fade-out','slide-in-right');

  void el.offsetWidth;
  el.classList.add('fade-out');

  setTimeout(() => {
    el.textContent = next;

    el.classList.remove('fade-out','slide-in-right');
    void el.offsetWidth;
    el.classList.add('slide-in-right');

    setTimeout(() => {
      el.classList.remove('slide-in-right');
    }, FADE_MS);

    updatePylonHeight();
  }, FADE_MS);
}

function transitionTitle(container, newTextRaw){
  const newText = (newTextRaw || '—').trim() || '—';
  const prev = container.getAttribute('data-title') || '';
  if (prev === newText){
    if(!rafs.has(container)) requestAnimationFrame(() => startMarquee(container));
    return;
  }

  cancelLoop(container);
  const inner = container.querySelector('.inner');
  container.setAttribute('data-title', newText);

  container.classList.remove('fade-out','slide-in-right');
  void container.offsetWidth;
  container.classList.add('fade-out');

  setTimeout(() => {
    inner.textContent = newText;
    inner.setAttribute('data-built','');
    inner.style.transform = 'translate3d(0,0,0)';

    container.classList.remove('fade-out','slide-in-right');
    void container.offsetWidth;
    container.classList.add('slide-in-right');

    requestAnimationFrame(() => startMarquee(container));
  }, FADE_MS);
}

function transitionHTML(el, html, sig){
  const cur = el.getAttribute('data-sig') || '';
  if (cur === sig) return;

  el.setAttribute('data-sig', sig);

  const temp = document.createElement('div');
  temp.innerHTML = html;

  const oldRows = Array.from(el.querySelectorAll('.currency-row'));
  const newRows = Array.from(temp.querySelectorAll('.currency-row'));

  if (!newRows.length) {
    el.innerHTML = '';
    return;
  }

  if (!oldRows.length) {
    el.innerHTML = html;

    if (bidSectionEl.classList.contains('collapsed')) {
      getBidPills().forEach(p => p.classList.add('pill-hidden'));
    }

    return;
  }

  newRows.forEach((newRow, i) => {
    const oldRow = oldRows[i];

    if (!oldRow) {
      if (bidSectionEl.classList.contains('collapsed')) {
        newRow.classList.add('pill-hidden');
      }
      el.appendChild(newRow);
      return;
    }

    const oldSpan = oldRow.querySelector('span');
    const newSpan = newRow.querySelector('span');

    if (!oldSpan || !newSpan) {
      oldRow.innerHTML = newRow.innerHTML;
      return;
    }

    const oldText = oldSpan.textContent.trim();
    const newText = newSpan.textContent.trim();

    if (oldText === newText) return;

    oldSpan.classList.remove('fade-out','slide-in-right');
    void oldSpan.offsetWidth;
    oldSpan.classList.add('fade-out');

    setTimeout(() => {
      oldSpan.textContent = newSpan.textContent;

      oldSpan.classList.remove('fade-out','slide-in-right');
      void oldSpan.offsetWidth;
      oldSpan.classList.add('slide-in-right');

      setTimeout(() => {
        oldSpan.classList.remove('slide-in-right');
      }, FADE_MS);
    }, FADE_MS);
  });

  while (el.children.length > newRows.length) {
    el.removeChild(el.lastElementChild);
  }
}

function transitionPhoto(src){
  const next = (src || '').trim();
  const cur = photoEl.getAttribute('data-src') || '';
  if (cur === next) return;

  if (next) {
    const preloaded = new Image();

    preloaded.onload = () => {
      photoPlaceholderEl.classList.add('hidden');

      if (photoEl.classList.contains('hidden')) {
        photoEl.src = next;
        photoEl.setAttribute('data-src', next);
        photoEl.classList.remove('hidden');
        photoEl.classList.remove('fade-out','slide-in-right');
        updatePylonHeight();
        return;
      }

      nextPhotoEl.src = next;
      nextPhotoEl.setAttribute('data-src', next);
      nextPhotoEl.classList.remove('hidden','photo-enter');
      void nextPhotoEl.offsetWidth;
      nextPhotoEl.classList.add('photo-enter');

      setTimeout(() => {
        photoEl.src = next;
        photoEl.setAttribute('data-src', next);

        nextPhotoEl.classList.add('hidden');
        nextPhotoEl.classList.remove('photo-enter');
        nextPhotoEl.removeAttribute('src');
        nextPhotoEl.setAttribute('data-src', '');

        updatePylonHeight();
      }, PHOTO_TRANSITION_MS);
    };

    preloaded.src = next;
    return;
  }

  photoEl.setAttribute('data-src', '');
  photoEl.removeAttribute('src');
  photoEl.classList.add('hidden');
  photoEl.classList.remove('fade-out', 'slide-in-right');

  nextPhotoEl.setAttribute('data-src', '');
  nextPhotoEl.removeAttribute('src');
  nextPhotoEl.classList.add('hidden');
  nextPhotoEl.classList.remove('photo-enter');

  photoPlaceholderEl.classList.remove('hidden');
  photoPlaceholderEl.classList.remove('fade-out', 'slide-in-right');
  void photoPlaceholderEl.offsetWidth;
  photoPlaceholderEl.classList.add('slide-in-right');

  setTimeout(() => {
    photoPlaceholderEl.classList.remove('slide-in-right');
  }, FADE_MS);

  updatePylonHeight();
}

function setPhotos(photos){
  const nextList = Array.isArray(photos) ? photos.filter(Boolean) : [];
  const sig = nextList.join('|');

  if ((photoEl.getAttribute('data-photo-list') || '') === sig) return;

  photoEl.setAttribute('data-photo-list', sig);
  photoList = nextList;
  photoIndex = 0;

  if (photoCycleTimer) {
    clearInterval(photoCycleTimer);
    photoCycleTimer = null;
  }

  transitionPhoto(photoList[0] || '');

  if (photoList.length > 1) {
    photoCycleTimer = setInterval(() => {
      photoIndex = (photoIndex + 1) % photoList.length;
      transitionPhoto(photoList[photoIndex]);
    }, PHOTO_CYCLE_MS);
  }
}

function escapeHTMLForRows(s){
  return (s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function hasBidValue(value){
  const v = (value || '').toString().trim();
  if (!v) return false;
  if (v === '—') return false;
  if (/^\$?\s*0(?:\.00)?$/i.test(v)) return false;
  return /\d/.test(v);
}

function isOfferedWithoutReserve(value){
  const v = (value || '').toString().trim();
  return /offered\s+without\s+reserve/i.test(v);
}

function clearBidAnimation(){
  if (bidAnimationTimer) {
    clearTimeout(bidAnimationTimer);
    bidAnimationTimer = null;
  }

  bidAnimationTimers.forEach(t => clearTimeout(t));
  bidAnimationTimers = [];
}

function getBidPills(){
  return [
    bidSectionEl.querySelector('.price-box'),
    ...Array.from(bidSectionEl.querySelectorAll('.currency-row'))
  ].filter(Boolean);
}

function setBidVisibility(shouldShow){
  const hasRealBid = !!shouldShow;

  if (pendingBidHideTimer) {
    clearTimeout(pendingBidHideTimer);
    pendingBidHideTimer = null;
  }

  if (lastBidVisibleState === hasRealBid) return;
  lastBidVisibleState = hasRealBid;

  if (hasRealBid) {
    bidSectionEl.classList.remove('collapsed');

    animatePylonHeightAfterLayoutChange(() => {});

    requestAnimationFrame(() => {
      getBidPills().forEach((pill, i) => {
        pill.classList.add('pill-hidden');

        setTimeout(() => {
          pill.classList.remove('pill-hidden');
        }, 380 + i * 130);
      });
    });

    return;
  }

  const pills = getBidPills();

  pills.forEach(pill => {
    pill.classList.add('pill-hidden');
  });

  pendingBidHideTimer = setTimeout(() => {
    pendingBidHideTimer = null;

    animatePylonHeightAfterLayoutChange(() => {
      bidSectionEl.classList.add('collapsed');
      currenciesEl.innerHTML = '';
      currenciesEl.setAttribute('data-sig', '');
      priceEl.textContent = '—';
      priceEl.setAttribute('data-text', '—');
    });
  }, 350);
}

function setReserveTextVisibility(shouldShow){
  reserveTextEl.classList.toggle('hidden', !shouldShow);

  updatePylonHeight();
  setTimeout(updatePylonHeight, 375);
}

function render(feed){
  const d = feed?.auctionDisplay || {};

  transitionText(lotEl, d.lot || 'Lot —');

  let titleText = d.title || '';

  if (d.year && !titleText.startsWith(d.year)) {
    titleText = `${d.year} ${titleText}`;
  }

  transitionTitle(titleWrap, titleText || '—');

  const showReserveText = isOfferedWithoutReserve(d.reserveStatus);
  setReserveTextVisibility(showReserveText);

  const showBid = hasBidValue(d.biddingPrice);

  if (showBid) {
    transitionText(priceEl, d.biddingPrice || '—');

    const currencies = Array.isArray(d.currencies) ? d.currencies.slice(0,4) : [];
    const currencyHTML = currencies.length
      ? currencies.map(c => `<div class="currency-row pill-hidden"><span>${escapeHTMLForRows(c)}</span></div>`).join('')
      : '';

    transitionHTML(currenciesEl, currencyHTML, currencies.join('|'));
    setBidVisibility(true);
  } else {
    setBidVisibility(false);
  }

  setPhotos(Array.isArray(d.photos) ? d.photos : []);
}

async function poll(){
  try{
    if(!ENDPOINT) throw new Error('Missing ?src');

    const url = ENDPOINT + (ENDPOINT.includes('?') ? '&' : '?') + '_=' + Date.now();
    const r = await fetch(url, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);

    const json = await r.json();
    render(json);

    statusEl.textContent = '';
  }catch(e){
    console.error('[pylon] fetch error:', e.message);
    statusEl.textContent = 'Feed unavailable';
  }
}

updatePylonHeight();
poll();
setInterval(poll, POLL);
window.addEventListener('resize', updatePylonHeight);
</script>
</body>
</html>
