<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=3840, height=2160, initial-scale=1" />
<title>Stream Ticker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    border: 0;
    outline: none;
    box-shadow: none;
  }

  body {
    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    color: #fff;
    user-select: none;
  }

  :root {
    --canvas-w: 3840px;
    --canvas-h: 2160px;
    --ticker-bar-height: 240px;
    --ticker-logo-panel-width: 960px;
    --ticker-logo-safe-inset: 35px;
    --ticker-up-next-x: calc(var(--ticker-logo-panel-width) + var(--ticker-logo-safe-inset));
    --ticker-lot-group-left-offset: 235px;
    --ticker-lot-1-anchor-x: 1540px;
    --ticker-lot-2-anchor-x: 2300px;
    --ticker-lot-3-anchor-x: 3060px;
    --ticker-lot-1-x: calc(var(--ticker-lot-1-anchor-x) - var(--ticker-lot-group-left-offset));
    --ticker-lot-2-x: calc(var(--ticker-lot-2-anchor-x) - var(--ticker-lot-group-left-offset));
    --ticker-lot-3-x: calc(var(--ticker-lot-3-anchor-x) - var(--ticker-lot-group-left-offset));
    --ticker-right-safe-inset: 35px;
    --ticker-up-next-width: calc(var(--ticker-lot-1-x) - var(--ticker-up-next-x));
    --ticker-lot-regions-width: calc(var(--canvas-w) - var(--ticker-lot-1-x) - var(--ticker-right-safe-inset));
    --ticker-lot-column-width: calc(var(--ticker-lot-regions-width) / 3);
  }

  .viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    border: 0;
    outline: none;
    box-shadow: none;
  }

  .display-stage {
    position: absolute;
    left: 0;
    bottom: 0;
    top: auto;
    width: var(--canvas-w);
    height: var(--canvas-h);
    transform-origin: left bottom;
    background: transparent;
    border: 0;
    outline: none;
    box-shadow: none;
  }

  .stream-ticker-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--ticker-bar-height);
    background: linear-gradient(
      to right,
      #000000 0,
      #000000 var(--ticker-logo-panel-width),
      #0f1316 var(--ticker-logo-panel-width),
      #0f1316 100%
    );
    overflow: hidden;
    border: 0;
    outline: none;
    box-shadow: none;
  }

  .logo-panel {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--ticker-logo-panel-width);
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: var(--ticker-logo-safe-inset);
    border: 0;
    outline: none;
    box-shadow: none;
    z-index: 2;
    margin: 0;
  }

  .logo-panel img {
    display: block;
    width: auto;
    height: auto;
    max-width: calc(var(--ticker-logo-panel-width) - (2 * var(--ticker-logo-safe-inset)));
    max-height: calc(var(--ticker-bar-height) - (2 * var(--ticker-logo-safe-inset)));
    object-fit: contain;
    border: 0;
    outline: none;
    box-shadow: none;
    background: transparent;
    vertical-align: top;
  }

  .up-next-label {
    position: absolute;
    left: var(--ticker-up-next-x);
    top: 0;
    bottom: 0;
    width: var(--ticker-up-next-width);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #ebebeb;
    font-size: 50px;
    font-weight: 400;
    line-height: 0.95;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    background: transparent;
    border: 0;
    outline: none;
    box-shadow: none;
    white-space: nowrap;
    z-index: 1;
  }

  .lot-regions {
    position: absolute;
    left: var(--ticker-lot-1-x);
    right: var(--ticker-right-safe-inset);
    top: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-width: 0;
    box-sizing: border-box;
  }

  .lot-entry {
    position: relative;
    top: auto;
    bottom: auto;
    left: auto;
    width: auto;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
    border: 0;
    outline: none;
    box-shadow: none;
    padding: 0 12px;
  }

  .lot-content {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    height: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  #slot1,
  #slot2,
  #slot3 {
    left: auto;
    width: auto;
  }

  .lot-number {
    flex: 0 0 auto;
    font-size: 45px;
    font-weight: 400;
    color: #0087db;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .title-scroll {
    position: relative;
    overflow: hidden;
    height: 1.2em;
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    font-size: 45px;
    font-weight: 400;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .title-scroll .inner {
    display: inline-block;
    white-space: nowrap;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    backface-visibility: hidden;
  }

  .title-scroll .inner.is-frozen {
    animation: none !important;
  }

  .hidden { display: none !important; }

  .lot-content.fade-out {
    animation: fadeOut 250ms ease-in-out both;
    will-change: opacity;
  }

  .lot-content.slide-in-right {
    animation: slideInRight 250ms ease-in-out both;
    will-change: transform, opacity;
  }

  .lot-entry.pill-dissolve {
    animation: fadeOut 250ms ease-in-out both;
    will-change: opacity;
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="viewport">
    <div id="stage" class="display-stage">
      <div class="stream-ticker-bar">
        <div class="logo-panel">
          <img src="/displays/pylon/logo.png" alt="Broad Arrow Auctions" />
        </div>
        <div class="up-next-label"><span>UP</span><span>NEXT</span></div>
        <div class="lot-regions">
        <div id="slot1" class="lot-entry hidden">
          <div class="lot-content">
            <span id="slot1Lot" class="lot-number"></span>
            <span id="slot1Title" class="title-scroll" data-title=""><span class="inner"></span></span>
          </div>
        </div>
        <div id="slot2" class="lot-entry hidden">
          <div class="lot-content">
            <span id="slot2Lot" class="lot-number"></span>
            <span id="slot2Title" class="title-scroll" data-title=""><span class="inner"></span></span>
          </div>
        </div>
        <div id="slot3" class="lot-entry hidden">
          <div class="lot-content">
            <span id="slot3Lot" class="lot-number"></span>
            <span id="slot3Title" class="title-scroll" data-title=""><span class="inner"></span></span>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>

<script>
/*__NEUD_LEGACY_TICKER_MARQUEE__*/
(function () {
  "use strict";

  var CANVAS_W = 3840;
  var CANVAS_H = 2160;
  var FADE_MS = 250;
  var MAX_UPCOMING_LOTS = 3;

  var legacyTickerMarquee = createLegacyTickerMarquee({ speedPxPerSecond: 40 });
  var cancelLoop = legacyTickerMarquee.cancelLoop.bind(legacyTickerMarquee);

  var stage = document.getElementById("stage");
  var slotStates = [
    {
      entry: document.getElementById("slot1"),
      content: document.querySelector("#slot1 .lot-content"),
      lot: document.getElementById("slot1Lot"),
      title: document.getElementById("slot1Title"),
      activeLotKey: null,
      transitionGeneration: 0,
    },
    {
      entry: document.getElementById("slot2"),
      content: document.querySelector("#slot2 .lot-content"),
      lot: document.getElementById("slot2Lot"),
      title: document.getElementById("slot2Title"),
      activeLotKey: null,
      transitionGeneration: 0,
    },
    {
      entry: document.getElementById("slot3"),
      content: document.querySelector("#slot3 .lot-content"),
      lot: document.getElementById("slot3Lot"),
      title: document.getElementById("slot3Title"),
      activeLotKey: null,
      transitionGeneration: 0,
    },
  ];

  var marqueeDiagnostics = { slots: [] };
  var layoutRefreshCount = 0;
  var destructiveRefreshCount = 0;
  var suppressedRefreshCount = 0;
  var lastRefreshReason = null;
  var slotLayoutSnapshot = [
    { viewportWidth: 0, textWidth: 0, titleSignature: "", layoutGeneration: -1 },
    { viewportWidth: 0, textWidth: 0, titleSignature: "", layoutGeneration: -1 },
    { viewportWidth: 0, textWidth: 0, titleSignature: "", layoutGeneration: -1 },
  ];

  function getTitleSignature(container) {
    return container ? container.getAttribute("data-title") || "" : "";
  }

  function updateMarqueeDiagnostics() {
    var activeAnimationCount = 0;
    var nearThresholdOverflow = false;
    var microAnimationPrevented = false;
    var firstFailureStage = null;
    var firstLoopFailureStage = null;
    var dotSpacerLoopEnabled = false;
    var scrollingSlotCount = 0;
    var scrollingWithSpacer = 0;
    var scrollingWithClone = 0;
    marqueeDiagnostics.slots.forEach(function (entry) {
      if (entry && entry.animationRunning) {
        activeAnimationCount += 1;
      }
      if (entry && entry.nearThresholdOverflow) {
        nearThresholdOverflow = true;
      }
      if (entry && entry.microAnimationPrevented) {
        microAnimationPrevented = true;
      }
      if (entry && entry.firstFailureStage && firstFailureStage == null) {
        firstFailureStage = entry.firstFailureStage;
      }
      if (entry && entry.firstLoopFailureStage && firstLoopFailureStage == null) {
        firstLoopFailureStage = entry.firstLoopFailureStage;
      }
      if (entry && entry.unstableMeasurement && firstFailureStage == null) {
        firstFailureStage = "font_not_stable";
      }
      if (entry && entry.shouldScroll) {
        scrollingSlotCount += 1;
        dotSpacerLoopEnabled = true;
        if (entry.spacerPresent) {
          scrollingWithSpacer += 1;
        }
        if (entry.clonePresent) {
          scrollingWithClone += 1;
        }
      }
    });
    window.__streamTickerMarqueeDiagnostics = {
      implementation: "legacy-ticker-shared",
      viewerMode:
        typeof window.__NEUD_VIEWER_MODE__ === "string"
          ? window.__NEUD_VIEWER_MODE__
          : "desktop-local",
      layoutReady: layoutRefreshCount > 0,
      iframeViewportWidth: window.innerWidth,
      iframeViewportHeight: window.innerHeight,
      refreshCount: layoutRefreshCount,
      layoutRefreshCount: layoutRefreshCount,
      destructiveRefreshCount: destructiveRefreshCount,
      suppressedRefreshCount: suppressedRefreshCount,
      lastRefreshReason: lastRefreshReason,
      activeAnimationCount: activeAnimationCount,
      nearThresholdOverflow: nearThresholdOverflow,
      microAnimationPrevented: microAnimationPrevented,
      firstFailureStage: firstFailureStage,
      firstLoopFailureStage: firstLoopFailureStage,
      dotSpacerLoopEnabled: dotSpacerLoopEnabled,
      allScrollingSlotsHaveSpacer:
        scrollingSlotCount > 0 && scrollingWithSpacer === scrollingSlotCount,
      allScrollingSlotsHaveClone:
        scrollingSlotCount > 0 && scrollingWithClone === scrollingSlotCount,
      slots: marqueeDiagnostics.slots.slice(),
      equalSlotWidths:
        marqueeDiagnostics.slots.length === 3 &&
        marqueeDiagnostics.slots.every(function (entry) {
          return Math.abs(entry.viewportWidth - marqueeDiagnostics.slots[0].viewportWidth) <= 1;
        }),
      slotWidths: marqueeDiagnostics.slots.map(function (entry) {
        return entry.viewportWidth;
      }),
    };
  }

  function textValue(value) {
    if (value == null) return "";
    return String(value).trim();
  }

  function formatLotLabel(raw) {
    var trimmed = textValue(raw);
    if (!trimmed || trimmed === "—") return "Lot —";
    if (/^lot\s+/i.test(trimmed)) return trimmed;
    return "Lot " + trimmed;
  }

  function buildLotKey(lot) {
    if (!lot) return "";
    return textValue(lot.lot) + "\u0000" + textValue(lot.title);
  }

  function scaleStage() {
    var scale = Math.min(window.innerWidth / CANVAS_W, window.innerHeight / CANVAS_H);
    stage.style.transform = "scale(" + scale + ")";
  }

  function getTitleInner(container) {
    return container ? container.querySelector(".inner") : null;
  }

  function startMarquee(container, slotIndex) {
    var slot = slotStates[slotIndex];
    var loopGeneration = slot ? slot.transitionGeneration : 0;

    legacyTickerMarquee.startMarqueeStable(container, {
      slotIndex: slotIndex,
      shouldAbort: function () {
        return Boolean(slot && slot.transitionGeneration !== loopGeneration);
      },
      onDiagnostic: function (entry) {
        marqueeDiagnostics.slots[slotIndex] = entry;
        updateMarqueeDiagnostics();
      },
    });
  }

  function freezeMarqueePosition(container) {
    var inner = getTitleInner(container);
    if (!inner) return null;

    var computed = window.getComputedStyle(inner).transform;
    if (computed && computed !== "none") {
      inner.style.transform = computed;
    }
    inner.classList.add("is-frozen");
    cancelLoop(container);
    return computed;
  }

  function unfreezeMarqueePosition(container) {
    var inner = getTitleInner(container);
    if (!inner) return;
    inner.classList.remove("is-frozen");
  }

  function writeSlotContent(slot, lotText, titleText) {
    var inner = getTitleInner(slot.title);
    slot.lot.textContent = lotText;
    slot.lot.setAttribute("data-text", lotText);
    slot.title.setAttribute("data-title", titleText);
    if (inner) {
      inner.textContent = titleText;
      inner.setAttribute("data-built", "");
      inner.style.transform = "translate3d(0,0,0)";
      inner.classList.remove("is-frozen");
    }
  }

  function beginContentExit(contentEl) {
    contentEl.classList.remove("fade-out", "slide-in-right");
    void contentEl.offsetWidth;
    contentEl.classList.add("fade-out");
  }

  function beginContentEntrance(contentEl, onComplete) {
    contentEl.classList.remove("fade-out", "slide-in-right");
    void contentEl.offsetWidth;
    contentEl.classList.add("slide-in-right");
    window.setTimeout(function () {
      contentEl.classList.remove("slide-in-right");
      if (typeof onComplete === "function") {
        onComplete();
      }
    }, FADE_MS);
  }

  function transitionSlot(slot, lotText, titleText) {
    var generation = ++slot.transitionGeneration;
    freezeMarqueePosition(slot.title);
    beginContentExit(slot.content);

    window.setTimeout(function () {
      if (generation !== slot.transitionGeneration) {
        return;
      }

      writeSlotContent(slot, lotText, titleText);
      beginContentEntrance(slot.content, function () {
        if (generation !== slot.transitionGeneration) {
          return;
        }
        requestAnimationFrame(function () {
          if (generation !== slot.transitionGeneration) {
            return;
          }
          startMarquee(slot.title, slotStates.indexOf(slot));
        });
      });
    }, FADE_MS);
  }

  function revealSlotFresh(slot, lotText, titleText, lotKeyValue) {
    var generation = ++slot.transitionGeneration;
    cancelLoop(slot.title);
    writeSlotContent(slot, lotText, titleText);
    slot.activeLotKey = lotKeyValue;
    slot.entry.classList.remove("hidden", "pill-dissolve");
    slot.content.classList.remove("fade-out", "slide-in-right");
    void slot.content.offsetWidth;
    slot.content.classList.add("slide-in-right");

    window.setTimeout(function () {
      if (generation !== slot.transitionGeneration) {
        return;
      }
      slot.content.classList.remove("slide-in-right");
      requestAnimationFrame(function () {
        if (generation !== slot.transitionGeneration) {
          return;
        }
        startMarquee(slot.title, slotStates.indexOf(slot));
      });
    }, FADE_MS);
  }

  function dissolveHideSlot(slot) {
    if (slot.entry.classList.contains("hidden")) {
      return;
    }

    ++slot.transitionGeneration;
    freezeMarqueePosition(slot.title);
    slot.entry.classList.remove("pill-dissolve");
    void slot.entry.offsetWidth;
    slot.entry.classList.add("pill-dissolve");

    window.setTimeout(function () {
      slot.entry.classList.add("hidden");
      slot.entry.classList.remove("pill-dissolve");
      slot.content.classList.remove("fade-out", "slide-in-right");
      slot.activeLotKey = null;
      cancelLoop(slot.title);
      unfreezeMarqueePosition(slot.title);
    }, FADE_MS);
  }

  function ensureSlotMarquee(slot) {
    if (slot.entry.classList.contains("hidden")) {
      return;
    }
    if (!legacyTickerMarquee.hasActiveLoop(slot.title)) {
      requestAnimationFrame(function () {
        startMarquee(slot.title, slotStates.indexOf(slot));
      });
    }
  }

  function remeasureAllMarquees() {
    slotStates.forEach(function (slot, slotIndex) {
      if (slot.entry.classList.contains("hidden")) {
        return;
      }
      cancelLoop(slot.title);
      startMarquee(slot.title, slotIndex);
    });
  }

  function refreshStreamTickerLayout(reason) {
    layoutRefreshCount += 1;
    lastRefreshReason = reason || "unknown";
    scaleStage();

    slotStates.forEach(function (slot, slotIndex) {
      if (slot.entry.classList.contains("hidden")) {
        return;
      }

      var container = slot.title;
      var viewportWidth = container.clientWidth;
      if (viewportWidth <= 0) {
        return;
      }

      var track = legacyTickerMarquee.ensureTrack(container);
      var titleSignature = getTitleSignature(container);
      var previous = slotLayoutSnapshot[slotIndex];
      var textWidth = track.textWidth || 0;
      var layoutGeneration = slot.transitionGeneration;

      if (
        previous.viewportWidth === viewportWidth &&
        previous.textWidth === textWidth &&
        previous.titleSignature === titleSignature &&
        previous.layoutGeneration === layoutGeneration
      ) {
        suppressedRefreshCount += 1;
        return;
      }

      var widthChanged = Math.abs(previous.viewportWidth - viewportWidth) > 0.5;
      var titleChanged = previous.titleSignature !== titleSignature;
      var generationChanged = previous.layoutGeneration !== layoutGeneration;

      if (
        !widthChanged &&
        !titleChanged &&
        !generationChanged &&
        legacyTickerMarquee.hasActiveLoop(container)
      ) {
        suppressedRefreshCount += 1;
        return;
      }

      if (legacyTickerMarquee.hasActiveLoop(container)) {
        destructiveRefreshCount += 1;
        cancelLoop(container);
      }

      slotLayoutSnapshot[slotIndex] = {
        viewportWidth: viewportWidth,
        textWidth: textWidth,
        titleSignature: titleSignature,
        layoutGeneration: layoutGeneration,
      };

      if (track.shouldScroll) {
        startMarquee(container, slotIndex);
      } else {
        var staticInner = container.querySelector(".inner");
        if (staticInner) {
          staticInner.style.transform = "translate3d(0,0,0)";
        }
      }
    });

    updateMarqueeDiagnostics();
  }

  window.__neudRefreshStreamTickerLayout = refreshStreamTickerLayout;

  function normalize(d) {
    if (!d) return { next: [] };
    var next = d.next || [];
    if ((!next || !next.length) && Array.isArray(d.lots) && d.lots.length) {
      var idx = d.lots.findIndex(function (x) {
        return x.status && /active/i.test(x.status);
      });
      if (idx >= 0) next = d.lots.slice(idx + 1, idx + 1 + MAX_UPCOMING_LOTS);
      else next = d.lots.slice(1, 1 + MAX_UPCOMING_LOTS);
    }
    return { next: (next || []).slice(0, MAX_UPCOMING_LOTS) };
  }

  window.placeNextLots = function placeNextLots(nextArr) {
    var items = Array.isArray(nextArr)
      ? nextArr.filter(function (entry) {
          return entry && textValue(entry.lot) && textValue(entry.title);
        })
      : [];
    var count = Math.min(items.length, MAX_UPCOMING_LOTS);
    var incomingKeys = [];

    for (var index = 0; index < MAX_UPCOMING_LOTS; index += 1) {
      incomingKeys[index] = index < count ? buildLotKey(items[index]) : null;
    }

    for (var slotIndex = 0; slotIndex < MAX_UPCOMING_LOTS; slotIndex += 1) {
      var slot = slotStates[slotIndex];
      var incomingKey = incomingKeys[slotIndex];
      var incoming = slotIndex < count ? items[slotIndex] : null;

      if (!incomingKey) {
        dissolveHideSlot(slot);
        continue;
      }

      var lotText = formatLotLabel(incoming.lot);
      var titleText = textValue(incoming.title) || "—";

      if (incomingKey === slot.activeLotKey) {
        if (slot.entry.classList.contains("hidden")) {
          revealSlotFresh(slot, lotText, titleText, incomingKey);
        } else {
          ensureSlotMarquee(slot);
        }
        continue;
      }

      if (slot.entry.classList.contains("hidden")) {
        revealSlotFresh(slot, lotText, titleText, incomingKey);
        continue;
      }

      slot.activeLotKey = incomingKey;
      transitionSlot(slot, lotText, titleText);
    }
  };

  scaleStage();
  window.addEventListener("resize", function () {
    scaleStage();
    remeasureAllMarquees();
  });

  /*__NEUD_STREAM_TICKER_BRIDGE__*/
})();
</script>
</body>
</html>
