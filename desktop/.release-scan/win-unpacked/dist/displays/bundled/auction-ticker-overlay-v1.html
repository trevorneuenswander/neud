<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auction Ticker Overlay</title>
<!-- Auction Ticker Overlay v5.2 (v4-sized) -->
<!-- Change: Match overall bar/pill sizing to v4 (bar min-height/padding + pill height/padding), keep v5 behavior/animations/fonts -->
<style>
  html,body{ margin:0; padding:0; background:transparent; }
  body{
    width:1920px; height:1080px;
    overflow:hidden;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    color:#fff;
  }

  :root{
    --bg:rgba(5,8,13,0.85);
    --pill:rgba(255,255,255,.10);
    --shadow:0 10px 36px rgba(0,0,0,.45);
    --radius:14px;

    --pill-gap:12px;      /* v4 feel */
    --title-min:160px;
  }

  .safe{ position:absolute; left:56px; right:56px; bottom:3px; }

  /* === v4-sized bar === */
  .bar{
    display:grid;
    grid-template-columns:auto 1fr;
    align-items:center;
    gap:16px;
    background:var(--bg);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:var(--radius);
    padding:12px 18px;     /* v4 */
    box-shadow:var(--shadow);
    min-height:46px;       /* v4 */
    overflow:hidden;
  }

  /* UP NEXT label: stacked, right-justified */
  .label{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    text-align:right;

    font-size:22px;
    font-weight:800;
    letter-spacing:.35px;
    opacity:.9;
    text-transform:uppercase;
    white-space:nowrap;
    line-height:1.05;
  }

  .pill-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:var(--pill-gap);
    align-items:center;
    width:100%;
    min-height:30px; /* v4 pill height; prevents bar “shrink” when pills hide */
  }

  /* === v4-sized pills === */
  .pill{
    display:flex;
    align-items:center;
    gap:12px;              /* matches v4-ish gap */
    background:var(--pill);
    border-radius:12px;
    padding:8px 12px;      /* v4 */
    font-weight:700;
    font-size:22px;
    white-space:nowrap;
    overflow:hidden;
    height:30px;           /* v4 */
    min-width:0;
  }

  /* Lot label/number spacing restored (no extra kerning) */
  .lot{
    flex:0 0 auto;
    white-space:nowrap;
    display:flex;
    align-items:center;

    text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.6);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;

    font-variant-numeric: tabular-nums;
    opacity:.95;
    font-weight:600;

    letter-spacing:0;
  }

  .title-scroll{
    position:relative;
    overflow:hidden;
    height:1.5em;
    flex:1 1 var(--title-min);
    min-width:var(--title-min);
    white-space:nowrap;
    display:flex;
    align-items:center;
    font-weight:500;
  }
  .title-scroll .inner{
    display:inline-block;
    white-space:nowrap;
    transform:translate3d(0,0,0);
    will-change:transform;
    backface-visibility:hidden;
  }

  .hidden{ display:none !important; }

  /* Text-only transitions (pills stay put) */
  .fade-out{
    animation: fadeOut 250ms ease-in-out both;
    will-change: opacity;
  }
  .slide-in-right{
    animation: slideInRight 250ms ease-in-out both;
    will-change: transform, opacity;
  }
  @keyframes fadeOut{ from{opacity:1;} to{opacity:0;} }
  @keyframes slideInRight{
    from{ opacity:0; transform:translateX(14px); }
    to  { opacity:1; transform:translateX(0); }
  }

  /* Pill dissolve (consistent fade when hiding) */
  .pill-dissolve{
    animation: fadeOut 250ms ease-in-out both;
    will-change: opacity;
  }

  .status{ margin-top:6px; font-size:12px; opacity:.55; }
</style>
</head>

<body>
  <div class="safe">
    <div id="variant-ticker" class="bar">
      <span class="label" id="labelNext">
        <span>UP</span>
        <span>NEXT</span>
      </span>

      <div class="pill-row" id="pillRow">
        <!-- LEFT -->
        <span id="slot1" class="pill">
          <span class="lot" id="slot1Lot">Lot —</span>
          <span class="title-scroll" id="slot1Title" data-title="—"><span class="inner">—</span></span>
        </span>

        <!-- MIDDLE -->
        <span id="slot2" class="pill">
          <span class="lot" id="slot2Lot">Lot —</span>
          <span class="title-scroll" id="slot2Title" data-title="—"><span class="inner">—</span></span>
        </span>

        <!-- RIGHT -->
        <span id="slot3" class="pill">
          <span class="lot" id="slot3Lot">Lot —</span>
          <span class="title-scroll" id="slot3Title" data-title="—"><span class="inner">—</span></span>
        </span>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

<script>
/* ===== v5.2: 3 UP NEXT pills + fixed marquee + no pre-flash + stable bar height ===== */

const params = new URLSearchParams(location.search);
const POLL  = +(params.get('poll') || 1000);
let ENDPOINT = params.get('src');
if (!ENDPOINT) { console.warn('[overlay] Missing ?src= endpoint'); }
else { try { ENDPOINT = new URL(ENDPOINT, location.origin).href; } catch(_) {} }

const statusEl = document.getElementById('status');

const slot1 = document.getElementById('slot1');
const slot2 = document.getElementById('slot2');
const slot3 = document.getElementById('slot3');

const slot1LotEl = document.getElementById('slot1Lot');
const slot2LotEl = document.getElementById('slot2Lot');
const slot3LotEl = document.getElementById('slot3Lot');

const slot1TitleEl = document.getElementById('slot1Title');
const slot2TitleEl = document.getElementById('slot2Title');
const slot3TitleEl = document.getElementById('slot3Title');

const V = 40;         // px/s cruise
const EASE_SEC = 1;   // ease-in/out duration
const PAUSE_MS = 4000;
const EPS = 0.5;

const FADE_MS = 250;
const rafs = new WeakMap();

/* ---------- marquee (restored original pattern: container has data-title) ---------- */
function cancelLoop(c){
  if(rafs.has(c)){
    cancelAnimationFrame(rafs.get(c));
    rafs.delete(c);
  }
}
function measureWidth(el){
  const r = el.getBoundingClientRect();
  return r.width || el.scrollWidth || 1e-6;
}
function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ensureTrack(container){
  const inner = container.querySelector('.inner');
  if(!inner) return {mode:'single', width:0};

  const text = (container.getAttribute('data-title') || inner.textContent || '—').trim() || '—';

  // IMPORTANT: if we are in the middle of fade-out, do NOT mutate inner/text here
  if (container.classList.contains('fade-out')) {
    const w = measureWidth(inner);
    if (w <= container.clientWidth + EPS) return {mode:'single', width:w};
    return {mode:'loop', width:Math.max(w, 1e-6)};
  }

  // render single copy to test fit
  inner.textContent = text;
  const singleW = measureWidth(inner);

  if (singleW <= container.clientWidth + EPS){
    inner.setAttribute('data-built','single');
    inner.style.transform = 'translate3d(0,0,0)';
    return {mode:'single', width:singleW};
  }

  // build looping track
  const sig = `loop:${text}`;
  if (inner.getAttribute('data-built') !== sig){
    const gap = '\u00A0\u00A0\u00A0•\u00A0\u00A0\u00A0';
    inner.innerHTML =
      `<span class="copyA">${escapeHTML(text)}</span>`+
      `<span class="gap">${gap}</span>`+
      `<span class="copyB">${escapeHTML(text)}</span>`;
    inner.setAttribute('data-built', sig);
  }

  const a = inner.querySelector('.copyA');
  const g = inner.querySelector('.gap');
  const loopW = (measureWidth(a) + measureWidth(g)) || 1e-6;

  return {mode:'loop', width:loopW};
}

function startMarquee(container){
  cancelLoop(container);
  const inner = container.querySelector('.inner');
  if(!inner) return;

  const tr = ensureTrack(container);
  if (tr.mode === 'single'){
    inner.style.transform = 'translate3d(0,0,0)';
    return;
  }

  // Kinematics for one exact pass over loopW
  const a = V / EASE_SEC;
  const easeDist = 0.5 * a * EASE_SEC * EASE_SEC;
  const cruiseDist = Math.max(0, tr.width - 2*easeDist);
  const cruiseSec = cruiseDist / V;
  const totalSec = EASE_SEC + cruiseSec + EASE_SEC;
  const totalMs  = totalSec * 1000;

  let phase = 'prepause';
  let t0 = performance.now();

  function sAt(ms){
    const t = ms/1000;
    if (t <= 0) return 0;
    if (t <= EASE_SEC) return 0.5*a*t*t;
    if (t <= EASE_SEC + cruiseSec) return easeDist + V*(t - EASE_SEC);
    if (t <= totalSec){
      const u = t - (EASE_SEC + cruiseSec);
      return easeDist + cruiseDist + (V*u - 0.5*a*u*u);
    }
    return tr.width;
  }

  function tick(now){
    const id = requestAnimationFrame(tick);
    rafs.set(container, id);

    if (phase === 'prepause'){
      inner.style.transform = 'translate3d(0,0,0)';
      if (now - t0 >= PAUSE_MS){ phase='scroll'; t0=now; }
      return;
    }

    const elapsed = now - t0;
    if (elapsed >= totalMs - 0.1){
      inner.style.transform = `translate3d(${-tr.width}px,0,0)`;
      inner.style.transform = 'translate3d(0,0,0)';
      phase = 'prepause';
      t0 = now;
      return;
    }

    const d = sAt(elapsed);
    inner.style.transform = `translate3d(${-d}px,0,0)`;
  }

  requestAnimationFrame(tick);
}

/* ---------- text transitions (prevent pre-flash) ---------- */
function transitionText(el, newText){
  const next = (newText ?? '').toString();
  const cur = el.getAttribute('data-text') ?? el.textContent ?? '';
  if (cur === next) return false;

  el.setAttribute('data-text', next);

  el.classList.remove('fade-out','slide-in-right');
  void el.offsetWidth;
  el.classList.add('fade-out');

  setTimeout(() => {
    el.textContent = next;

    el.classList.remove('fade-out','slide-in-right');
    void el.offsetWidth;
    el.classList.add('slide-in-right');
  }, FADE_MS);

  return true;
}

function transitionTitle(container, newTextRaw){
  const newText = (newTextRaw || '—').trim() || '—';
  const prevSig = container.getAttribute('data-title') || '';

  if (prevSig === newText){
    if (!rafs.has(container)) requestAnimationFrame(() => startMarquee(container));
    return false;
  }

  // Freeze marquee during fade-out
  cancelLoop(container);
  const inner = container.querySelector('.inner');

  container.setAttribute('data-title', newText);

  container.classList.remove('fade-out','slide-in-right');
  void container.offsetWidth;
  container.classList.add('fade-out');

  setTimeout(() => {
    inner.textContent = newText;
    inner.setAttribute('data-built',''); // force rebuild loop logic for new title
    inner.style.transform = 'translate3d(0,0,0)';

    container.classList.remove('fade-out','slide-in-right');
    void container.offsetWidth;
    container.classList.add('slide-in-right');

    requestAnimationFrame(() => startMarquee(container));
  }, FADE_MS);

  return true;
}

/* ---------- pill dissolve / show (consistent) ---------- */
function dissolveHidePill(pill){
  if (pill.classList.contains('hidden')) return;

  pill.classList.remove('pill-dissolve');
  void pill.offsetWidth;
  pill.classList.add('pill-dissolve');

  setTimeout(() => {
    pill.classList.add('hidden');
    pill.classList.remove('pill-dissolve');
  }, FADE_MS);
}

function showPill(pill){
  if (!pill.classList.contains('hidden')) return;

  pill.classList.remove('hidden');
  pill.classList.remove('slide-in-right','fade-out','pill-dissolve');
  void pill.offsetWidth;
  pill.classList.add('slide-in-right');

  setTimeout(() => pill.classList.remove('slide-in-right'), FADE_MS);
}

/*
  Your rule:
  - 3 upcoming -> L/M/R
  - 2 upcoming -> L/M (RIGHT dissolves)
  - 1 upcoming -> L only (MIDDLE dissolves)
  - 0 upcoming -> none (LEFT dissolves)
*/
function placeNextLots(nextArr){
  const n = Array.isArray(nextArr) ? nextArr.filter(Boolean) : [];
  const count = n.length;

  if (count >= 3){
    showPill(slot1); showPill(slot2); showPill(slot3);
    applyLotToSlot(1, n[0]);
    applyLotToSlot(2, n[1]);
    applyLotToSlot(3, n[2]);
    return;
  }

  if (count === 2){
    showPill(slot1); showPill(slot2);
    dissolveHidePill(slot3);

    applyLotToSlot(1, n[0]);
    applyLotToSlot(2, n[1]);
    return;
  }

  if (count === 1){
    showPill(slot1);
    dissolveHidePill(slot2);
    dissolveHidePill(slot3);

    applyLotToSlot(1, n[0]);
    return;
  }

  dissolveHidePill(slot1);
  dissolveHidePill(slot2);
  dissolveHidePill(slot3);
}

function applyLotToSlot(slotIndex, lotObj){
  const lotText = lotObj?.lot ? `Lot ${lotObj.lot}` : 'Lot —';
  const titleText = (lotObj?.title || lotObj?.desc || '').trim();

  if (slotIndex === 1){
    transitionText(slot1LotEl, lotText);
    transitionTitle(slot1TitleEl, titleText);
  } else if (slotIndex === 2){
    transitionText(slot2LotEl, lotText);
    transitionTitle(slot2TitleEl, titleText);
  } else if (slotIndex === 3){
    transitionText(slot3LotEl, lotText);
    transitionTitle(slot3TitleEl, titleText);
  }
}

/* ---------- Normalize server feed ---------- */
function normalize(d){
  if(!d) return { next: [] };

  let next = d.next || [];

  if ((!next || !next.length) && Array.isArray(d.lots) && d.lots.length){
    const idx = d.lots.findIndex(x => x.status && /active/i.test(x.status));
    if (idx >= 0) next = d.lots.slice(idx+1, idx+4);
    else next = d.lots.slice(1,4);
  }

  next = (next || []).slice(0,3);
  return { next };
}

/* ---------- poll ---------- */
async function poll(){
  try{
    if(!ENDPOINT) throw new Error('Missing ?src');
    const url = ENDPOINT + (ENDPOINT.includes('?') ? '&' : '?') + '_=' + Date.now();
    const r = await fetch(url, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const json = await r.json();

    const d = normalize(json);
    placeNextLots(d.next);

    statusEl.textContent = '';
  }catch(e){
    console.error('[overlay] fetch error:', e.message);
    statusEl.textContent = 'Feed unavailable';
  }
}

poll();
setInterval(poll, POLL);
</script>
</body>
</html>
