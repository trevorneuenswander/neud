<!DOCTYPE html>

  <body>
    <div class="container" id="main-container">
      <form
        novalidate="novalidate"
        class="form-horizontal edit_vehicle"
        id="edit_vehicle_6041"
        action="/vehicles/6041"
        accept-charset="UTF-8"
        method="post"

        <input name="utf8" type="hidden" value="✓" />
        <input type="hidden" name="_method" value="patch" />

            <input

              type="text"
              value="VE26Lot_101"
              name="vehicle[lot]"
              id="vehicle_lot"
            />
          </div>
        </div>
        <div class="control-group decimal optional vehicle_current_price">

            />

        </div>
        <div class="control-group decimal optional vehicle_reserve_price">
          <label class="decimal optional control-label" for="vehicle_reserve_price"

          >

            <input
              class="numeric decimal optional"
              type="number"
              step="any"
              value="0.0"

              id="vehicle_reserve_price"
            />
          </div>
        </div>
        <div class="control-group boolean optional vehicle_sold">
          <label class="boolean optional control-label" for="vehicle_sold">Sold</label>
          <div class="controls">
            <input value="0" type="hidden" name="vehicle[sold]" />

              <input
                class="boolean optional"
                type="checkbox"
                value="1"

                id="vehicle_sold"
              />

        </div>
        <div class="control-group boolean optional vehicle_reserves_off">

                class="boolean optional"
                type="checkbox"
                value="1"
                name="vehicle[reserves_off]"
                id="vehicle_reserves_off"
              />
            </label>
          </div>
        </div>
        <div class="control-group boolean optional vehicle_no_reserve">
          <label class="boolean optional control-label" for="vehicle_no_reserve">No reserve</label>
          <div class="controls">
            <input value="0" type="hidden" name="vehicle[no_reserve]" />
            <label class="checkbox">
              <input
                class="boolean optional"
                type="checkbox"
                value="1"
                checked="checked"
                name="vehicle[no_reserve]"
                id="vehicle_no_reserve"
              />

        </div>
