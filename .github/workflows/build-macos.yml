name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "desktop/**"
      - "workers/**"
      - "shared/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig*.json"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read
  actions: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEUD_USE_LOCAL_DATA: "1"
      NEXT_PUBLIC_NEUD_USE_LOCAL_DATA: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      # Unsigned CI builds: do not require Developer ID certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public Supabase configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing required GitHub Actions secrets for desktop cloud runtime config."
            exit 1
          fi

      - name: Static macOS packaging tests
        run: |
          node --test desktop/scripts/test-neud-macos-packaging.mjs
          node --test desktop/scripts/test-neud-macos-item-1b-parity.mjs
          node --test desktop/scripts/test-neud-macos-item-1c-parity.mjs
          node --test desktop/scripts/test-scraper-transport-diagnostics.mjs
          node --test desktop/scripts/test-packaged-faye-transport-parity.mjs
          node --test desktop/scripts/test-packaged-browser-platform-resolution.mjs

      - name: Prefetch Chrome for Testing (darwin arm64)
        run: npx puppeteer browsers install chrome
        working-directory: workers/data-engine

      - name: Build web (standalone)
        run: |
          set -euo pipefail
          npm run build:web 2>&1 | tee /tmp/neud-build-web.log
          test -f .next/standalone/server.js

      - name: Compile desktop host
        run: |
          set -euo pipefail
          npm run build -w @neud/desktop 2>&1 | tee /tmp/neud-build-desktop.log
          node --test desktop/scripts/test-display-preview-lookup-diagnostic.mjs
          node --test desktop/scripts/test-engine-session-facing-errors.mjs
          test -f desktop/dist/bootstrap.js

      - name: Stage desktop resources
        run: |
          set -euo pipefail
          node desktop/scripts/stage-standalone.mjs 2>&1 | tee /tmp/neud-stage-standalone.log
          test -f desktop/staging/runtime-config/cloud.json
          test -f desktop/staging/worker/dist/adapters/bag-event-driven-session.js

      - name: Electron-pack macOS app directory
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/ensure-macos-icon.mjs
          npx electron-builder --mac dir --arm64 --config electron-builder.yml --publish never 2>&1 | tee /tmp/neud-electron-mac-dir.log
          test -d release/mac-arm64/NEUD.app

      - name: Verify macOS dir package
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/ensure-packaged-app-update-config.mjs --mac
          node scripts/verify-packaged-auto-update-config.mjs --mac
          node scripts/verify-mac-unpacked-runtime-assets.mjs
          node scripts/verify-packaged-cloud-config.mjs

      - name: Electron-pack macOS dmg and zip
        working-directory: desktop
        run: |
          set -euo pipefail
          npx electron-builder --mac dmg zip --prepackaged release/mac-arm64 --config electron-builder.yml --publish never --arm64 2>&1 | tee /tmp/neud-electron-mac-dmg.log
          node scripts/verify-packaged-auto-update-config.mjs --mac --require-latest-mac-yml
          node scripts/prepare-release-artifacts-mac.mjs

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neud-macos-build-logs
          path: |
            /tmp/neud-*.log

      - name: Verify bundled browser
        run: npm run verify:mac-bundled-browser

      - name: Verify macOS package layout
        run: npm run verify:mac-package

      - name: Verify packaged Electron main dependencies
        run: node desktop/scripts/verify-packaged-electron-main-deps.mjs

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neud-macos-arm64
          path: |
            desktop/release/NEUD-*-arm64.dmg
            desktop/release/NEUD-*-arm64.zip
            desktop/release/NEUD-*-arm64.zip.blockmap
            desktop/release/latest-mac.yml
