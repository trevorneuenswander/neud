name: Build Windows Development

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (default: selected branch)"
        required: false
        type: string
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  build-windows-dev:
    # Pin to windows-2022 for node-gyp / VS toolset compatibility (same as Release Windows).
    runs-on: windows-2022
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEUD_REQUIRE_REAL_DECKLINK: "1"
      NEUD_WITH_FFMPEG: "1"
      NEUD_DEV_BUILD_ID: "activity-sync-aliases-1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Require Google build service account variable
        shell: bash
        run: |
          if [ -z "${{ vars.NEUD_GCP_BUILD_SERVICE_ACCOUNT }}" ]; then
            echo "Missing repository variable NEUD_GCP_BUILD_SERVICE_ACCOUNT."
            echo "Set it to neud-build-dependencies@<GCP_PROJECT_ID>.iam.gserviceaccount.com"
            echo "See docs/output-engine/decklink-windows-release.md."
            exit 1
          fi

      - name: Install Blackmagic DeckLink SDK from private Google Drive
        uses: ./.github/actions/setup-decklink-sdk-windows
        with:
          workload_identity_provider: projects/241025226693/locations/global/workloadIdentityPools/neud-github-actions/providers/github-actions
          service_account: ${{ vars.NEUD_GCP_BUILD_SERVICE_ACCOUNT }}
          drive_file_id: 1iYubcuA0WzlsLG6jilF2nR7_hC2sx-8A

      - name: Install dependencies
        run: npm ci

      - name: Targeted release regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:neud-release-version
          npm run test:packaged-auth-config
          npm run test:neud-packaged-browser
          npm run test:live-display-latency
          npm run test:display-data-get-proxy
          node --test desktop/scripts/test-neud-bag-event-driven-live.mjs
          node --test desktop/scripts/test-neud-v0-2-0-display-transport-sync.mjs
          node --test desktop/scripts/test-neud-v0-3-1-stabilization.mjs
          node --test desktop/scripts/test-neud-v0-3-1-video-playback-controls.mjs
          node --experimental-strip-types --test desktop/scripts/test-neud-v0-3-1-activity-sync-project-aliases.mjs
          node --test desktop/scripts/test-activity-sync-project-mapping.mjs
          node --test desktop/scripts/test-activity-sync.mjs
          node --test desktop/scripts/test-windows-recording-orientation.mjs

      - name: Build unsigned Windows package
        run: npm run package:win

      - name: Activity sync insert regression (requires dist)
        shell: bash
        run: |
          set -euo pipefail
          node --test desktop/scripts/test-activity-sync.mjs

      - name: Recording orientation and live-stats regressions
        run: |
          node --test desktop/scripts/test-recording-live-stats.mjs
          node --test desktop/scripts/test-neud-v0-3-0-record-to-disk.mjs

      - name: SQLite migration 046 regression
        run: node --test desktop/scripts/test-neud-sqlite-migration-046-orphan-recovery.mjs

      - name: Windows ProRes decode smoke (LGPL FFmpeg)
        shell: bash
        run: node desktop/scripts/smoke-windows-prores-decode.mjs

      - name: Windows ProRes playback controls smoke
        shell: bash
        run: node desktop/scripts/smoke-windows-prores-playback-controls.mjs

      - name: Windows H.264 recording orientation smoke
        shell: bash
        run: node desktop/scripts/smoke-windows-recording-orientation.mjs

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          # Distinct from prior hardware-test installers (do not overwrite retained artifacts).
          name: neud-windows-dev-${{ env.NEUD_DEV_BUILD_ID }}-${{ github.sha }}
          path: |
            desktop/release/NEUD-Setup-*-x64.exe
            desktop/dist/build-info.json
            desktop/dist/platform/decklink/neud_decklink.meta.json
            desktop/dist/platform/windows/ffmpeg/**
